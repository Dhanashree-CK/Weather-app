<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yours Truly Weather</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1 class="title">Yours Truly Weather</h1>

        <form method="POST">
            <!-- 🔥 Removed auto-filled value -->
            <input type="text" name="city" placeholder="Enter city name" required autocomplete="off">
            <button type="submit">Check Weather</button>
        </form>

        {% if weather %}
        <div class="card">
            <h2>{{ weather.city }}</h2>
            <p>🌡️ {{ weather.temperature }}°C</p>
            <p>💧 Humidity: {{ weather.humidity }}%</p>
            <p>🌤️ Condition: {{ weather.condition }}</p>
            <img src="https://openweathermap.org/img/wn/{{ weather.icon }}@2x.png" alt="icon">
        </div>

        <div class="btn-group">
            <a href="/5_days/{{ weather.city }}"><button>5 Day Forecast</button></a>
        </div>
        {% endif %}
    </div>
</body>
</html>
